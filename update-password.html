<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Set new password — Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nexus.css?v=20260824h"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card auth-card">
    <div style="text-align:center;margin-bottom:22px;">
      <div class="display" style="font-size:22px;">Choose a new password</div>
    </div>
    <label>New password</label>
    <input id="npPass" type="password" placeholder="At least 8 characters" style="margin-bottom:18px;"/>
    <button class="btn btn-primary" style="width:100%;" onclick="updatePw()">Update password</button>
  </div>
</div>
<script src="supabase-client.js?v=20260824h"></script>
<script src="auth-guard.js?v=20260824h"></script>
<script>
async function updatePw(){
  const password = document.getElementById('npPass').value;
  if (password.length < 8) return nexusToast('Password must be at least 8 characters.', 'err');
  const { error } = await nexus.auth.updateUser({ password });
  if (error) return nexusToast(error.message, 'err');
  nexusToast('Password updated. Redirecting to sign in…', 'ok');
  await nexus.auth.signOut();
  setTimeout(()=> window.location.href = 'login.html', 1500);
}
</script>
</body>
</html>
