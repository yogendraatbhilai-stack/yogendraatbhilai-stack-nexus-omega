<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Digital Division Console – Nexus</title>

<style>
:root{--navy:#0E2A47;--gold:#D4AF37;--green:#1F6F4A;--red:#B3261E;--amber:#C98A00;--bg:#F4F5F7;--card:#fff;--ink:#1B2430;--muted:#5D6B7A;--line:#E1E5EA;}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:19px;letter-spacing:.3px}
header .sub{font-size:12px;color:#C9D3DE;margin-top:2px}
header .hos{text-align:right;font-size:12px;color:#C9D3DE}
header .hos b{color:var(--gold);font-size:13px}
header select{background:#16375A;color:#fff;border-color:#36597E;margin-top:4px}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;padding:12px 14px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
main{padding:18px 20px 60px;max-width:1440px;margin:0 auto}
h2{font-size:17px;margin:4px 0 14px;color:var(--navy)}
h3{font-size:14.5px;margin:0 0 10px;color:var(--navy)}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:600px){.g2{grid-template-columns:1fr}main{padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.stat.warn .n{color:var(--red)}
.score{display:flex;justify-content:space-between;align-items:flex-start}
.score .big{font-size:34px;font-weight:700;color:var(--navy)}
.band{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:600;color:#fff}
.b0{background:var(--green)}.b1{background:var(--navy)}.b2{background:var(--amber)}.b3{background:var(--red)}
.muted{color:var(--muted)}.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);padding:7px 8px;background:#FAFBFC}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F9FB}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#EEF1F4;color:var(--ink);white-space:nowrap}
.p-red{background:#FBE7E6;color:var(--red)}.p-amber{background:#FFF3D6;color:#8A5E00}.p-green{background:#E2F1E8;color:var(--green)}.p-navy{background:#E3E9F0;color:var(--navy)}.p-gold{background:#FBF1CF;color:#7A5E00}
.bar{height:8px;background:#EEF1F4;border-radius:5px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--navy)}
.hb{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.hb .t{height:14px;background:#EEF1F4;border-radius:4px;overflow:hidden;display:flex}
.hb .t i{display:block;height:100%}
button.btn,label.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;display:inline-block}
button.btn.sm{padding:4px 10px;font-size:12px}
button.btn.sec,label.btn.sec{background:#fff;color:var(--navy);border:1px solid #C5CED8}
button.btn.gold{background:var(--gold);color:var(--navy);font-weight:600}
button.btn.ok{background:var(--green)}
button.btn.danger{background:#fff;color:var(--red);border:1px solid #E8B4B0}
button.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #C5CED8;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:56px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.chk{flex-direction:row!important;align-items:center;gap:8px;margin-top:18px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid #C5CED8;background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--navy)}
.subtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#modal{position:fixed;inset:0;background:rgba(14,42,71,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
#modal .box{background:#fff;border-radius:12px;max-width:920px;width:100%;padding:18px 20px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;display:none;z-index:30}
.banner{background:#FFF8E1;border:1px solid #EBD58A;border-radius:10px;padding:12px 16px;margin-bottom:14px}
.adm .card{margin-bottom:14px}
.adm table input,.adm table select{width:100%}
.hist{font-size:12px;color:var(--muted);max-height:140px;overflow:auto;border-left:3px solid var(--gold);padding-left:10px}
.warnline{color:var(--red);font-size:12px}
.grid31{border-collapse:separate;border-spacing:2px;font-size:11px}
.grid31 td,.grid31 th{border:0;padding:3px 2px;text-align:center;background:none}
.grid31 td.jn{text-align:left;font-size:12px;min-width:220px}
.c{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:700}
.c-ontime{background:#2E8B57;color:#fff}.c-late{background:#E3A008;color:#fff}.c-missed{background:#C62828;color:#fff}.c-na{background:#B0B8C1;color:#fff}.c-today{background:#fff;border:2px solid var(--navy);color:var(--navy);line-height:16px}.c-due{background:#fff;border:2px dashed var(--amber);line-height:16px}.c-upcoming{background:#EEF1F4;color:#9AA5B1}
.legend span{margin-right:12px;font-size:12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1}
.exp{border-left:4px solid var(--red);padding-left:8px}
.guide p,.guide li{line-height:1.55;max-width:900px}
.guide h3{margin-top:18px}
.lvl{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.lvl div{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#FAFBFC}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px}
@media print{nav,header select,button,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0}.card{break-inside:avoid;border-color:#ccc}}
.reqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.reqcard{border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:var(--ink)}
.reqcard:hover{border-color:#9DB4CC}.reqcard.on{border-color:var(--navy);background:#F4F7FB}
.route{background:#F4F7FB;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.65}
.form label>div{padding:4px 0}
@media print{body{display:none!important}}
</style>
</head>

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dtStr=d=>`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

const nowStr=()=>dtStr(new Date());

const uid=()=>Math.random().toString(36).slice(2,9);
const r1=x=>x==null||isNaN(x)?null:Math.round(x*10)/10;
function pDate(s){if(!s)return null;const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);}
function pDT(s){if(!s)return null;if(s.length<=10)return new Date(s+'T00:00');return new Date(s);}
function fmtD(s){if(!s)return '—';return pDT(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});}
function fmtDT(s){if(!s)return '—';const d=pDT(s);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function monthLabel(m){const[y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
function prevMonth(m){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-2,1);return ymd(d).slice(0,7);}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',1500);}

/* ===================== Identity & data layer (Nexus / Supabase) ===================== */
let S,CTX=null,ME={role:'requester',dept:'',head:false,name:'',id:''},MEMBERS=[],READY=false,CFG_MISSING=false,PROFILES=null,cfgTimer=null;
const JOBROWS={};
/* settings that every signed-in person may read (needed to raise and track requests) */
const PUBLIC_CFG=['org','approval','deptApproval','tat','stages','departments','weeklyOff','dayStart','dayEnd','holidays','systems'];
function emptyState(){return{settings:defaults().settings,items:[],allItems:[],daily:[],jobs:{},meas:{},ovr:{},snapshots:{},welcomed:true,lastBackup:'',actor:'requester'};}
S=emptyState();
const isHos=()=>ME.role==='hos';
const canSeeTeam=()=>ME.role==='hos'||ME.role==='dscm';
const P=()=>S.settings.people;
function pname(r){const m=MEMBERS.find(x=>x.dd_role===r);return (m&&m.full_name)||(r==='hos'&&P().hos&&P().hos.name)||ROLES[r]||r;}
function dbErr(e){console.error(e);alert('Could not save: '+(e&&e.message?e.message:e)+'\n\nYour change was not saved. The latest data will now be reloaded.');reload();}
async function reload(){try{await loadAll();render();}catch(e){console.error(e);toast('Could not refresh');}}
async function fetchAll(mk){let out=[],from=0;const step=1000;for(;;){const{data,error}=await mk().range(from,from+step-1);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<step)break;from+=step;}return out;}
const rowToItem=r=>Object.assign(newItem(r.log),r.data,{id:r.id,approval:r.approval,requesterId:r.requester_id,requesterName:r.requester_name,dept:r.dept,version:r.version,_raw:r.data});
/* only send what really changed: keys that were never stored and still hold their default are left out */
function itemPayload(it){const raw=it._raw||{},def=newItem(it.log),d={};Object.keys(it).forEach(k=>{if(['id','approval','requesterId','requesterName','version','dept','_raw'].indexOf(k)>=0)return;if(!(k in raw)&&JSON.stringify(it[k])===JSON.stringify(def[k]))return;d[k]=it[k];});return d;}
function replaceItem(ni){const i=S.allItems.findIndex(x=>x.id===ni.id);if(i>=0)S.allItems[i]=ni;else S.allItems.push(ni);S.items=S.allItems.filter(x=>x.approval==='approved');}
async function loadMembers(){const{data,error}=await nexus.from('dd_members').select('*');if(error)throw error;MEMBERS=data||[];const me=MEMBERS.find(m=>m.user_id===CTX.profile.id);ME.dept=(me&&me.dept)||'';ME.head=!!(me&&me.is_dept_head);ME.role=CTX.profile.role==='admin'?'hos':((me&&me.dd_role)||'requester');S.actor=ME.role;}
async function loadAll(){
 await loadMembers();
 const{data:kv,error:ke}=await nexus.from('dd_kv').select('*');if(ke)throw ke;
 const get=k=>(kv.find(x=>x.key===k)||{}).data;
 const pub=get('cfg_public'),priv=get('cfg_private');
 CFG_MISSING=!pub;
 if(isHos()&&(!pub||!priv)){S.settings=defaults().settings;S.settings.goLive=today();await saveCfgNow(true);CFG_MISSING=false;}
 else S.settings=Object.assign(defaults().settings,pub||{},priv||{});
 S.meas={};S.ovr={};S.snapshots={};
 kv.forEach(x=>{if(x.key.indexOf('meas:')===0)S.meas[x.key.slice(5)]=x.data;else if(x.key.indexOf('ovr:')===0){const role=x.key.slice(4);Object.keys(x.data||{}).forEach(m=>{(S.ovr[m]=S.ovr[m]||{})[role]=x.data[m];});}else if(x.key.indexOf('snap:')===0)S.snapshots[x.key.slice(5)]=x.data;});
 const rows=await fetchAll(()=>nexus.from('dd_items').select('*').order('id'));
 S.allItems=rows.map(rowToItem);S.items=S.allItems.filter(i=>i.approval==='approved');
 if(ME.role==='requester'){S.jobs={};S.daily=[];}
 else{
  const jr=await fetchAll(()=>nexus.from('dd_jobs').select('*').order('key'));S.jobs={};Object.keys(JOBROWS).forEach(k=>delete JOBROWS[k]);jr.forEach(r=>{S.jobs[r.key]=r.data;JOBROWS[r.key]=1;});
  const dr=await fetchAll(()=>nexus.from('dd_daily').select('*').order('date'));S.daily=dr.map(r=>Object.assign({},r.data,{id:r.id,date:r.date,role:r.role,_row:true}));
 }
}
/* settings are saved by Head of Sales only (database enforces this too) */
function save(){if(!isHos())return;clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>saveCfgNow(),600);}
async function saveCfgNow(force){if(!isHos())return;cfgTimer=null;const st=S.settings,pub={},priv={};Object.keys(st).forEach(k=>{(PUBLIC_CFG.indexOf(k)>=0?pub:priv)[k]=st[k];});const{error}=await nexus.from('dd_kv').upsert([{key:'cfg_public',data:pub},{key:'cfg_private',data:priv}]);if(error){if(force)throw error;dbErr(error);}else if(!force){try{nexusLogEvent(CTX.profile,'dd_settings_changed',{});}catch(e){}}}

/* ===================== Working calendar ===================== */
const isWork=d=>!S.settings.weeklyOff.includes(d.getDay())&&!S.settings.holidays.includes(ymd(d));
const hm=s=>(s||'09:30').split(':').map(Number);
function sod(d){const x=new Date(d);const[a,b]=hm(S.settings.dayStart);x.setHours(a,b,0,0);return x;}
function eod(d){const x=new Date(d);const[a,b]=hm(S.settings.dayEnd);x.setHours(a,b,0,0);return x;}
function nextWorkStart(d){let x=new Date(d);x.setDate(x.getDate()+1);x=sod(x);let g=0;while(!isWork(x)&&g++<400)x.setDate(x.getDate()+1);return x;}
function normWork(d){let x=new Date(d),g=0;while(g++<400){if(!isWork(x)||x>=eod(x)){x=nextWorkStart(x);continue;}if(x<sod(x))x=sod(x);return x;}return x;}
function addWorkHours(start,h){let d=normWork(start),m=h*60,g=0;while(m>0&&g++<1000){const left=(eod(d)-d)/60000;if(m<=left){d=new Date(d.getTime()+m*60000);m=0;}else{m-=left;d=nextWorkStart(d);}}return d;}
function addWorkDays(start,n){let d=new Date(start),g=0;while(n>0&&g++<2000){d.setDate(d.getDate()+1);if(isWork(d))n--;}return eod(d);}
function wdBetween(a,b){const A=pDate(ymd(a)),B=pDate(ymd(b));if(B.getTime()===A.getTime())return 0;let s=B>A?1:-1,d=new Date(A),c=0,g=0;while(d.getTime()!==B.getTime()&&g++<3000){d.setDate(d.getDate()+s);if(isWork(d))c+=s;}return c;}
function workDaysInMonth(m,upto=true){const[y,mm]=m.split('-').map(Number);let d=new Date(y,mm-1,1),c=0;{const g=S.settings.goLive?pDate(S.settings.goLive):null;if(g&&g>d)d=new Date(g);}const lim=upto?new Date():new Date(y,mm,0);while(d.getMonth()===mm-1&&d<=lim){if(isWork(d))c++;d.setDate(d.getDate()+1);}return c;}
function workHoursBetween(a,b){a=new Date(a);b=new Date(b);if(b<=a)return 0;let h=0,d=new Date(a);d.setHours(0,0,0,0);let g=0;while(d<=b&&g++<500){if(isWork(d)){const s=Math.max(sod(d),a),e=Math.min(eod(d),b);if(e>s)h+=(e-s)/36e5;}d.setDate(d.getDate()+1);}return h;}
function monthBounds(m){const[y,mm]=m.split('-').map(Number);const s=new Date(y,mm-1,1);const e=new Date(Math.min(new Date(y,mm,0,23,59).getTime(),Date.now()));return[s,e];}

/* ===================== Scheduled jobs ===================== */
function dueDates(j,m){const g=S.settings.goLive||'';const r=dueDatesRaw(j,m);return g?r.filter(d=>d>=g):r;}
function dueDatesRaw(j,m){const[y,mm]=m.split('-').map(Number);const out=[];const last=new Date(y,mm,0).getDate();
 const fwd=d=>{let g=0;while(!isWork(d)&&g++<20)d.setDate(d.getDate()+1);return d;};
 if(j.freq==='daily'){for(let i=1;i<=last;i++){const d=new Date(y,mm-1,i);if(isWork(d))out.push(ymd(d));}return out;}
 if(j.freq==='weekly'){for(let i=1;i<=last;i++){const d=new Date(y,mm-1,i);if(d.getDay()===+j.dow){const s=fwd(new Date(d));if(s.getMonth()===mm-1)out.push(ymd(s));}}return out;}
 if(j.freq==='quarterly'&&((mm-1)%3)!==((+j.qm||1)-1))return out;
 const spec=String(j.day||'1').toUpperCase();let d=null;
 if(spec==='L'){d=new Date(y,mm-1,last);let g=0;while(!isWork(d)&&g++<20)d.setDate(d.getDate()-1);}
 else if(/^W\d+$/.test(spec)){const n=+spec.slice(1);let c=0;for(let i=1;i<=last;i++){const x=new Date(y,mm-1,i);if(isWork(x)&&++c===n){d=x;break;}}}
 else{d=fwd(new Date(y,mm-1,Math.min(last,+spec||1)));if(d.getMonth()!==mm-1)d=null;}
 if(d)out.push(ymd(d));return out;}
const jKey=(j,d)=>j.id+'|'+d;
function graceEnd(j,d){const g=+S.settings.grace[j.freq]||0;return g?ymd(addWorkDays(pDate(d),g)):d;}
function jStat(j,d){const r=S.jobs[jKey(j,d)];const lim=graceEnd(j,d);if(r&&r.na)return'na';if(r&&r.doneAt)return r.doneAt.slice(0,10)<=lim?'ontime':'late';const t=today();if(t>lim)return'missed';if(d>t)return'upcoming';return d===t?'today':'due';}
const activeJobs=role=>S.settings.jobs.filter(j=>j.role===role&&j.active!==false);
function schedStats(role,kra,m){const st={ontime:0,late:0,missed:0,na:0,open:0,total:0};activeJobs(role).filter(j=>!kra||j.kra===kra).forEach(j=>dueDates(j,m).forEach(d=>{const s=jStat(j,d);if(s==='upcoming')return;st.total++;if(s==='today'||s==='due')st.open++;else st[s]++;}));const n=st.ontime+st.late+st.missed;st.score=n?r1((st.ontime+st.late*S.settings.lateCredit/100)/n*100):null;st.judged=n;return st;}
const jSym={ontime:'✓',late:'L',missed:'✗',na:'–',today:'•',due:'!',upcoming:''};

/* ===================== Items ===================== */
const stagesOf=log=>S.settings.stages[log]||[];
const typeOf=it=>(S.settings.tat[it.log]||[]).find(t=>t.code===it.type);
const kraOf=it=>typeOf(it)?.kra||'';
function stageP(it){const st=stagesOf(it.log);const s=st[Math.min(it.stage||0,st.length-1)];return s?s.p:0;}
function stageN(it){const st=stagesOf(it.log);const s=st[Math.min(it.stage||0,st.length-1)];return s?s.n:'—';}
const isDone=it=>it.status!=='Cancelled'&&(stageP(it)>=100||it.status==='Closed – no response');
const isOpen=it=>!isDone(it)&&it.status!=='Cancelled';
function baseDue(it){if(it.dueOverride)return pDT(it.dueOverride);const t=typeOf(it);if(!t||!it.loggedAt)return null;const st=pDT(it.startedAt||it.loggedAt);if(it.log==='STL')return addWorkHours(st,+t.hours||0);if(!(+t.days))return null;return addWorkDays(st,+t.days);}
function effDue(it){const b=baseDue(it);if(!b)return null;const p=+it.paused||0;return p>0?addWorkDays(b,p):b;}
function isOverdue(it){if(!isOpen(it)||it.status==='On hold')return false;const d=effDue(it);return d&&new Date()>d;}
function withinTat(it){if(!isDone(it)||!it.closedAt||it.status==='Closed – no response')return null;const d=effDue(it);if(!d)return null;return pDT(it.closedAt)<=d;}
function daysOver(it){const d=effDue(it);return d?Math.max(0,wdBetween(d,new Date())):0;}
function genId(log,at){const p=LOGS[log].prefix,d=pDT(at)||new Date();const tag=p+'-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+'-';const n=S.items.filter(i=>i.id.startsWith(tag)).map(i=>+i.id.slice(tag.length)||0);return tag+String((n.length?Math.max(...n):0)+1).padStart(3,'0');}
const ownerRole=it=>LOGS[it.log].owner;
function rag(it){if(isDone(it))return'Done';if(it.status==='Cancelled')return'Cancelled';const end=it.revisedEnd?eod(pDate(it.revisedEnd)):effDue(it);if(!end)return it.blocker?'Amber':'Green';const now=new Date();if(now>end)return'Red';const left=wdBetween(now,end);if(it.blocker||it.status==='On hold'||(left<=2&&stageP(it)<85))return'Amber';return'Green';}
const ragPill=r=>`<span class="pill ${r==='Red'?'p-red':r==='Amber'?'p-amber':r==='Green'?'p-green':'p-navy'}">${r}</span>`;
function setStageOf(it,idx,note){const prev=isDone(it);it.stage=idx;it.history=it.history||[];it.history.push({at:nowStr(),stage:stageN(it),note:note||'',by:S.actor,byName:ME.name});if(isDone(it)){if(!prev||!it.closedAt)it.closedAt=nowStr();if(it.expedite)it.expedite.cleared=nowStr();}else it.closedAt='';}

/* ===================== Metrics (all measured) ===================== */
const closedIn=(log,m)=>S.items.filter(i=>i.log===log&&isDone(i)&&i.closedAt&&i.closedAt.startsWith(m));
const loggedIn=(log,m)=>S.items.filter(i=>i.log===log&&i.loggedAt&&i.loggedAt.startsWith(m));
const pct=(a,b)=>b?r1(a/b*100):null;
function tatOf(list){const c=list.map(withinTat).filter(x=>x!==null);return pct(c.filter(Boolean).length,c.length);}
const tatPct=(log,m)=>tatOf(closedIn(log,m));
function avgTat(log,m){const c=closedIn(log,m).filter(i=>i.status!=='Closed – no response');if(!c.length)return null;return r1(c.reduce((a,i)=>a+Math.max(0,wdBetween(pDT(i.startedAt||i.loggedAt),pDT(i.closedAt))-(+i.paused||0)),0)/c.length);}
const repOf=(role,m)=>S.daily.filter(d=>d.role===role&&d.date.startsWith(m));
const roleLogs=role=>Object.keys(LOGS).filter(l=>LOGS[l].owner===role);
function itemsClosedForKra(role,kra,m){return S.items.filter(i=>roleLogs(role).includes(i.log)&&kraOf(i)===kra&&isDone(i)&&i.closedAt&&i.closedAt.startsWith(m));}
function metric(src,m,role,kra){
 switch(src){
  case'sched':return schedStats(role,kra,m).score;
  case'items_tat':return tatOf(itemsClosedForKra(role,kra,m));
  case'uptime':{const crit=S.settings.systems.filter(s=>s.crit==='A').map(s=>s.name);if(!crit.length)return null;const[a,b]=monthBounds(m);const poss=workHoursBetween(a,b)*crit.length;if(!poss)return null;let down=0;S.items.filter(i=>i.log==='STL'&&i.outage&&crit.includes(i.system)).forEach(i=>{const s=new Date(Math.max(pDT(i.loggedAt),a)),e=new Date(Math.min(i.closedAt?pDT(i.closedAt):Date.now(),b));down+=workHoursBetween(s,e);});return r1(Math.max(0,100-down/poss*100));}
  case'stl_repeat':{const l=loggedIn('STL',m);return pct(l.filter(i=>i.repeat).length,l.length);}
  case'vendor_sla':return tatOf(closedIn('STL',m).filter(i=>i.vendor&&i.vendor!=='In-house'));
  case'release_defects':return S.items.filter(i=>i.log==='STL'&&i.releaseDefect&&(i.loggedAt||'').startsWith(m)).length;
  case'cmp_goal':{const c=closedIn('CMP',m).filter(i=>+i.goalTarget>0);if(!c.length)return null;return r1(c.reduce((a,i)=>a+Math.min(150,(+i.goalActual||0)/(+i.goalTarget)*100),0)/c.length);}
  case'drl_tat':return tatPct('DRL',m);
  case'drl_ftr':{const c=closedIn('DRL',m).filter(i=>i.status!=='Closed – no response');return pct(c.filter(i=>(+i.revisions||0)<=1).length,c.length);}
  case'drl_score':{const c=closedIn('DRL',m).filter(i=>+i.score>0);return c.length?r1(c.reduce((a,i)=>a+(+i.score),0)/c.length):null;}
  case'drl_event_lead':{const c=closedIn('DRL',m).filter(i=>i.eventDate);return pct(c.filter(i=>wdBetween(pDT(i.closedAt),pDate(i.eventDate))>=S.settings.eventLead).length,c.length);}
  case'drl_errors':return closedIn('DRL',m).filter(i=>i.errorAfter).length+S.items.filter(i=>i.log==='DRL'&&i.errorAfter&&i.errorAt&&i.errorAt.startsWith(m)&&!(i.closedAt||'').startsWith(m)).length;
  case'compliance_gate':{const c=closedIn('DRL',m).filter(i=>i.conf!=='Restricted'||true);const ci=stagesOf('DRL').findIndex(s=>/compliance/i.test(s.n));if(ci<0)return null;return pct(c.filter(i=>(i.maxStage??i.stage)>=ci&&(i.history||[]).some(h=>/compliance/i.test(h.stage))).length,c.length);}
  case'compliance_obs':return S.items.filter(i=>i.log==='DRL'&&(i.closedAt||i.loggedAt||'').startsWith(m)).reduce((a,i)=>a+(+i.complianceObs||0),0);
  case'posts_plan':{const r=repOf('rbe',m);const s=r.reduce((a,d)=>a+(+d.postsScheduled||0),0);return pct(r.reduce((a,d)=>a+(+d.postsPublished||0),0),s);}
  case'eng_growth':{const c=S.meas[m],p=S.meas[prevMonth(m)];if(!c||!p||!+c.reach||!+p.reach||!+p.engagements)return null;const rc=c.engagements/c.reach,rp=p.engagements/p.reach;return r1((rc/rp-1)*100);}
  case'bra_ontime':return tatPct('BRA',m);
  case'media_count':return closedIn('BRA',m).filter(i=>['PR','MC'].includes(i.type)).length;
  case'brand_deviations':return closedIn('BRA',m).filter(i=>i.type==='AU').reduce((a,i)=>a+(+i.deviations||0),0);
  case'outcome_reports':{const c=closedIn('BRA',m).filter(i=>i.type==='SPN');return pct(c.filter(i=>i.outcomeReport).length,c.length);}
  case'google_rating':{const c=S.meas[m];return c&&c.rating!==''&&c.rating!=null?+c.rating:null;}
  case'brand_reviews':{const r=repOf('brand',m);return pct(r.reduce((a,d)=>a+(+d.reviewsReplied||0),0),r.reduce((a,d)=>a+(+d.reviewsNew||0),0));}
  case'awareness_change':{const c=S.meas[m];if(!c||c.awareness===''||c.awareness==null)return null;let p=m;for(let i=0;i<12;i++){p=prevMonth(p);const x=S.meas[p];if(x&&x.awareness!==''&&x.awareness!=null)return r1(+c.awareness-+x.awareness);}return null;}
  case'rep_dscm':case'rep_rbe':case'rep_brand':{let w=workDaysInMonth(m);const tt=today();if(tt.startsWith(m)&&isWork(new Date())&&!S.daily.some(x=>x.date===tt&&x.role===src.slice(4)))w--;return w?Math.min(100,pct(repOf(src.slice(4),m).length,w)):null;}
  case'team_reviewed':{const r=[...repOf('rbe',m),...repOf('brand',m)];return pct(r.filter(x=>x.reviewed).length,r.length);}

const jobRole=k=>{const j=S.settings.jobs.find(x=>x.id===k.split('|')[0]);return j?j.role:null;};
async function putJob(k,data,msg){try{const role=jobRole(k);let res;
  if(JOBROWS[k])res=await nexus.from('dd_jobs').update({data}).eq('key',k).select().single();
  else res=await nexus.from('dd_jobs').insert({key:k,role,data}).select().single();
  if(res.error)throw res.error;S.jobs[k]=res.data.data;JOBROWS[k]=1;render();if(msg)toast(msg);}catch(e){dbErr(e);}}
async function doJob(k){const note=prompt('Mark done. Optional note / evidence (link, ticket ID, file name):','');if(note===null)return;const r=Object.assign({},S.jobs[k]||{},{doneAt:nowStr(),by:S.actor,note,returned:''});delete r.verifiedAt;await putJob(k,r,'Marked done');}
async function naJob(k){const why=prompt('Why is this job not applicable this time? (e.g. holiday, system retired)');if(!why)return;await putJob(k,Object.assign({},S.jobs[k]||{},{na:true,naReason:why,by:S.actor,at:nowStr()}));}
async function verifyJob(k){const r=S.jobs[k];if(!r)return;await putJob(k,Object.assign({},r,{verifiedAt:nowStr(),verifiedBy:S.actor}),'Verified');}
async function verifyAll(roles){if(!confirm('Verify all listed jobs? Only do this after checking them.'))return;try{for(const role of roles){for(const x of awaitingVerify(role)){const k=jKey(x.j,x.d);const res=await nexus.from('dd_jobs').update({data:Object.assign({},x.r,{verifiedAt:nowStr(),verifiedBy:S.actor})}).eq('key',k).select().single();if(res.error)throw res.error;S.jobs[k]=res.data.data;}}render();toast('Verified');}catch(e){dbErr(e);}}
async function rejectJob(k){const why=prompt('Send back: what is missing?');if(!why)return;const r=Object.assign({},S.jobs[k]);delete r.doneAt;delete r.verifiedAt;r.returned=why;await putJob(k,r,'Sent back — the job is open again');}
async function undoJob(k){if(!confirm('Undo this entry?'))return;try{const{error}=await nexus.from('dd_jobs').delete().eq('key',k);if(error)throw error;delete S.jobs[k];delete JOBROWS[k];render();}catch(e){dbErr(e);}}
async function expediteJob(k){const n=prompt('Expedite note (what you need and by when):');if(!n)return;await putJob(k,Object.assign({},S.jobs[k]||{},{expedite:{at:nowStr(),note:n,by:S.actor}}),'Expedited');}

const clone=o=>JSON.parse(JSON.stringify(o));
const hist=(stage,note)=>({at:nowStr(),stage,note:note||'',by:S.actor,byName:ME.name});
async function putItem(it,msg,approval){
 const row={data:itemPayload(it)};if(approval)row.approval=approval;if(isHos())row.dept=it.dept;
 const{data,error}=await nexus.from('dd_items').update(row).eq('id',it.id).eq('version',it.version).select();
 if(error)return dbErr(error);

 <div class="subtabs">${canSeeTeam()?['dscm','rbe','brand'].map(r=>`<button class="${role===r?'on':''}" onclick="chkRole='${r}';render()">${ROLES[r]}</button>`).join(''):''}</div>
 <p class="small muted">Every recurring duty of ${esc(pname(role))}, day by day. Click a due box to mark it done (a past date counts as late). Grace: daily ${S.settings.grace.daily}, weekly ${S.settings.grace.weekly}, monthly ${S.settings.grace.monthly}, quarterly ${S.settings.grace.quarterly} working days. Late work earns ${S.settings.lateCredit}% credit; missed earns 0.</p>

  js.forEach(j=>{const dd=dueDates(j,m);const mine={ontime:0,late:0,missed:0};dd.forEach(d=>{const x=jStat(j,d);if(mine[x]!=null)mine[x]++;});const n=mine.ontime+mine.late+mine.missed;h+=`<tr><td class="jn">${esc(j.name)} <span class="small muted">${FREQ[j.freq]}</span></td>${Array.from({length:last},(_,i)=>{const d=`${m}-${pad(i+1)}`;if(!dd.includes(d))return'<td></td>';const x=jStat(j,d);const r=S.jobs[jKey(j,d)]||{};return`<td><span class="c c-${x}" title="${esc(d+' · '+x+(r.verifiedAt?' · verified':'')+(r.note?' · '+r.note:''))}" onclick="cell('${jKey(j,d)}','${x}','${role}')">${jSym[x]}${r.verifiedAt?'':''}</span></td>`;}).join('')}<td><b>${n?Math.round((mine.ontime+mine.late*S.settings.lateCredit/100)/n*100)+'%':'—'}</b></td></tr>`;});});
 h+=`</table></div>`;
 const s=schedStats(role,null,m);
 h+=`<div class="card" style="margin-top:14px"><b>${monthLabel(m)} so far:</b> ${s.ontime} on time · ${s.late} late · ${s.missed} missed · ${s.na} not applicable · ${s.open} open → <b>${s.score??'—'}%</b> scheduled-job score.</div>`;

function cell(k,state,role){if(state==='upcoming'){toast('Not due yet');return;}if(state==='ontime'||state==='late'||state==='na'){if(S.actor==='hos'||S.actor==='dscm')undoJob(k);else toast('Only DSCM or Head of Sales can undo');return;}if(!(S.actor===role||S.actor==='hos')){toast('Only '+pname(role)+' can tick this job');return;}doJob(k);}

 });

function exportCsv(){const cols=['id','log','title','dept','requester','type','kra','priority','conf','loggedAt','due','stage','pct','status','closedAt','withinTat','paused','revisions','score','system','vendor','vendorTicket','outage','repeat','isProject','expedited','blocker'];const rows=S.items.map(i=>{const d=effDue(i);const o={...i,kra:kraOf(i),due:d?dtStr(d):'',stage:stageN(i),pct:stageP(i),withinTat:withinTat(i),expedited:i.expedite?i.expedite.at:''};return cols.map(c=>`"${String(o[c]??'').replace(/"/g,'""')}"`).join(',');});dl('digital_division_logs_'+today()+'.csv',[cols.join(','),...rows].join('\n'),'text/csv');}
function dl(name,txt,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ===================== Guide ===================== */
function rGuide(){const W=S.settings.weights;return`<div class="guide"><h2>How the Digital Division console works — in plain words</h2>
<div class="card"><h3 style="margin-top:0">1. Three levels</h3><div class="lvl"><div><b>Level 1 — the doers</b><br>Resource Building Executive and Brand Manager. They tick off their jobs and move their requests through stages.</div><div><b>Level 2 — Division Head (DSCM)</b><br>Does his own systems work, and <b>verifies</b> the team's ticks and <b>expedites</b> anything slipping.</div><div><b>Level 3 — you, Head of Sales</b><br>Sees everything, verifies the DSCM's ticks, expedites anyone, and approves the month's scores.</div></div><p class="small muted">You sign in with your own Nexus ID, and the screen shows only what your role allows. Every tick, verification, approval and expedite carries your name and the server time — nobody can act as someone else.</p></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">2. Three kinds of work — all measured</h3><ol>
<li><b>Scheduled jobs (Checklists)</b> — work that repeats: daily health checks, weekly backups, monthly calendar, quarterly audits. The tool knows when each is due. When the person ticks it, the tool records the time. On time = full credit, late = ${S.settings.lateCredit}% credit, missed = zero.</li>
<li><b>Requests & tickets (contingent work)</b> — anything raised by someone: a CRM breakdown, an invitation design, a press release. Each gets an ID and a deadline from the TAT table, and moves through stages (Logged → … → Closed). Closed before the deadline = "met".</li>
<li><b>Projects</b> — bigger requests ticked "Track as project". Progress % comes from the stage, so nobody guesses. Red / Amber / Green is automatic.</li></ol></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">3. How a score is made</h3><p>Every KRA has 2–4 KPIs, and every KPI reads a number the tool already measured. Example for the RBE's <b>R2 Social media (20%)</b>:</p><ul><li>Scheduled social jobs on time this month: 92% vs target 100% → KPI score 92%</li><li>Social post requests closed within TAT: 90% vs target 90% → 100%</li><li>Engagement-rate growth from the monthly figures: 6% vs target 10% → 60%</li></ul><p>Average = 84% → R2 earns 84% × 20 = <b>16.8 points</b>. All KRAs added together = the RBE's score out of 100.</p><p>The DSCM's score = own KRAs (out of ${W.A}) + RBE score × ${W.B}% + Brand score × ${W.C}%. So if the team does well, the DSCM gains; if the team slips, he loses — that is why he verifies and expedites.</p><p>Rating: 90+ Outstanding · 75–89 Exceeds · 60–74 Meets · below 60 Improvement plan. No typing of scores — only the admin can override, with a written reason that shows in the MIS.</p></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">4. Your 5-minute daily routine (around 18:45)</h3><ol><li>Open <b>Overview</b>. Look at the six numbers at the top. Anything red needs a question.</li><li>Look at <b>Overdue requests</b> and <b>Projects needing attention</b>. Press <b>Expedite</b> on anything that worries you and write what you need by when. It jumps to the top of that person's list with a red mark.</li><li>Open <b>Daily reports</b> for today. Read "Blockers" and "Decisions needed". Act on decisions.</li><li>Once or twice a week, open <b>My work → DSCM</b> and verify the DSCM's ticked jobs (or "Send back" if not convincing).</li></ol></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">5. Weekly and monthly</h3><ul><li><b>Monday (30 min):</b> open <b>Checklists</b> for each person — the grid shows every red ✗ (missed) at a glance. Open <b>Reports</b> sections 2 and 3. Ask about anything red.</li><li><b>Friday (15 min):</b> <b>Projects</b> — approve or reject revised end dates.</li><li><b>Month end:</b> RBE/Brand enter the platform figures (reach, engagements, Google rating, survey score) on the KRA page. On the 3rd working day open <b>KRA scorecards</b>, check, and press <b>Close month</b>. Print the <b>Reports</b> page as the MIS.</li></ul></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">6. What the colours and marks mean</h3><p><span class="c c-ontime">✓</span> on time · <span class="c c-late">L</span> done late · <span class="c c-missed">✗</span> missed · <span class="c c-today">•</span> due today · <span class="c c-due">!</span> due, grace running · <span class="c c-na">–</span> not applicable · ${ragPill('Red')} past end date · ${ragPill('Amber')} at risk · ${ragPill('Green')} on plan · <span class="pill p-red">expedited</span> senior has pushed it · <span class="pill p-gold">override</span> admin changed a value.</p></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">7. What you control (Control panel)</h3><ul><li>Names at each level, the ${W.A}/${W.B}/${W.C} split, rating bands.</li><li><b>Job register</b> — add or remove any daily/weekly/monthly/quarterly job, link it to a KRA. New duty? Add a job — it is measured from tomorrow.</li><li><b>KRAs & KPIs</b> — weights, targets, and which measured number each KPI uses.</li><li><b>TAT standards</b> — deadlines for each request type, and which KRA each type counts towards.</li><li>Stages, working days, holidays, departments, systems, vendors.</li><li><b>People & roles, Approval rules</b> — who holds each role, department heads, and which requests need your approval.</li><li><b>Data</b> — stored securely in Nexus; you can export a copy any time.</li></ul></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">8. Rules that keep the numbers honest</h3><ul><li>A job ticked after its grace period counts as late automatically — nobody can tick "on time" later.</li><li>The logged time of a request can only be changed by admin, so deadlines can't be shifted quietly.</li><li>Pausing a request (waiting on the requester) must be entered as paused days — visible on the item.</li><li>"N/A" on a job needs a reason and is shown in the checklist.</li><li>Seniors can "Send back" a ticked job — it becomes open again.</li><li>Times (logged, done, verified, closed, approved) are stamped by the server. Nobody can back-date them.</li></ul></div>
<div class="card" style="margin-top:12px"><h3 style="margin-top:0">9. How other departments raise work</h3><ol><li>Anyone opens <b>Raise a request</b> and picks what they need (system problem, app change, campaign, content/design, brand/PR).</li><li>The system sends it to the right person, sets the deadline from the TAT table and gives an ID. The requester follows it in <b>My requests</b> and rates a delivery 1–5 (this feeds the RBE's Request fulfilment score).</li><li><b>System tickets go straight to the DSCM.</b> Everything else — campaigns, development, content, brand work — first goes to the requester's department head (where one is set) and then to the Head of Sales. <b>Nothing is added to anyone's job sheet until the Head of Sales approves it.</b> The deadline clock starts at approval.</li></ol></div></div>`;}

/* ===================== Attachments ===================== */
async function uploadFiles(itemId,files){const out=[];for(const f of files){if(f.size>5*1024*1024){toast(f.name+' is over 5 MB — skipped');continue;}const safe=f.name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80);const path=itemId+'/'+Date.now()+'_'+safe;const{error}=await nexus.storage.from('dd-files').upload(path,f,{upsert:false});if(error){console.error(error);toast('Upload failed: '+f.name);continue;}out.push({path,name:f.name,size:f.size,at:nowStr(),by:ME.name});}return out;}
async function dlFile(path,name){const{data,error}=await nexus.storage.from('dd-files').download(path);if(error){toast('Could not open the file');return;}const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const filesHtml=it=>(it.files&&it.files.length)?it.files.map(f=>`<div class="small"><a href="#" data-p="${esc(f.path)}" data-n="${esc(f.name)}" onclick="dlFile(this.dataset.p,this.dataset.n);return false">📎 ${esc(f.name)}</a> <span class="muted">· ${Math.round((f.size||0)/1024)} KB · ${esc(f.by||'')} ${fmtDT(f.at)}</span></div>`).join(''):'<div class="small muted">No files attached.</div>';
async function addFilesTo(id,inputId){const el=document.getElementById(inputId);if(!el||!el.files.length)return;const it0=S.allItems.find(i=>i.id===id);if(!it0)return;toast('Uploading…');const up=await uploadFiles(id,[...el.files]);if(!up.length)return;const it=clone(it0);it.files=(it.files||[]).concat(up);await putItem(it,'Files added');closeModal();openItem(id);}

/* ===================== Raise a request (everyone) ===================== */
const REQ_MENU=[
 {log:'STL',t:'A system is not working',h:'CRM, back-office software, website, WhatsApp, a login or access problem'},
 {log:'DEV',t:'Change or new feature in an app',h:'Nexus, reports, forms, filters, new screens'},
 {log:'CMP',t:'Campaign for an event',h:'Retirement School, Investor Awareness Programme, a drive'},
 {log:'DRL',t:'Content or design',h:'Post, invitation, PPT, certificates, video, blog, newsletter'},
 {log:'BRA',t:'Brand, PR or media',h:'Press release, sponsorship, online reviews, brand audit'}
];
function tatText(t,log){if(!t)return'';if(log==='STL')return t.hours+' working hours to resolve';return t.days?t.days+' working day'+(t.days>1?'s':'')+' after approval':'date fixed at approval';}
function routeHtml(log,type){const L=LOGS[log],t=(S.settings.tat[log]||[]).find(x=>x.code===type);const own=L.owner;
 const appr=log==='STL'?'No approval needed — system tickets go straight to the Digital Division.':(ME.head?'Needs approval by the Head of Sales.':'Needs approval: your department head (if your department has one), then the Head of Sales.');
 return`<div class="route"><b>Goes to:</b> ${esc(pname(own))} <span class="muted">(${esc(ROLES[own])})</span><br><b>Approval:</b> ${appr}${log!=='STL'?'<br><span class="muted">Nothing is added to the Digital Division job sheet until it is approved.</span>':''}<br><b>Deadline:</b> ${esc(tatText(t,log))||'—'}</div>`;}
function rRaise(){
 if(reqDone){const d=reqDone;return`<h2>Request submitted</h2><div class="card" style="max-width:640px"><p style="font-size:15px"><b>${esc(d.id)}</b> — ${esc(d.title)}</p><p>${d.approval==='approved'?`It has gone straight to <b>${esc(pname(LOGS[d.log].owner))}</b>.`:`It is now <b>${d.approval==='dept'?'waiting for your department head':'waiting for the Head of Sales'}</b>. It reaches the Digital Division only after approval.`}</p><div class="row"><button class="btn" onclick="go('myreq')">See My requests</button><button class="btn sec" onclick="reqDone=null;reqLog=null;render()">Raise another</button></div></div>`;}
 let h=`<h2>Raise a request to the Digital Division</h2><p class="small muted">Pick what you need. The system sends it to the right person, sets the deadline and gives you an ID so you can follow it.</p>
 <div class="reqgrid">${REQ_MENU.map(m=>`<button class="reqcard ${reqLog===m.log?'on':''}" onclick="reqLog='${m.log}';render()"><b>${esc(m.t)}</b><div class="small muted" style="margin-top:4px">${esc(m.h)}</div></button>`).join('')}</div>`;
 if(!reqLog)return h;
 const log=reqLog,L=LOGS[log],types=S.settings.tat[log]||[];
 const typeOpts=types.map(t=>[t.code,t.label.replace(/^(XS|S|M|L) — /,'').replace(/^S[1-4] /,'')+' ('+tatText(t,log)+')']);
 h+=`<div class="card" style="margin-top:14px;max-width:820px"><h3>${esc(REQ_MENU.find(m=>m.log===log).t)}</h3><div class="form">
 <label class="full">What exactly do you need?<select id="rq_type" onchange="document.getElementById('rq_route').innerHTML=routeHtml('${log}',this.value)">${opt(typeOpts,'')}</select></label>
 <label class="full">Title (short)<input id="rq_title" maxlength="120" placeholder="e.g. Invitation for Retirement School, 14 Dec"></label>
 <label class="full">Details<textarea id="rq_desc" placeholder="What is needed, who it is for, any content/links, anything the team should know"></textarea></label>
 ${ME.dept?`<label>Your department<input value="${esc(ME.dept)}" disabled></label>`:`<label>Your department<select id="rq_dept"><option value="">Select…</option>${opt(S.settings.departments,'')}</select></label>`}
 <label>Requested by<input id="rq_req" value="${esc(ME.name)}"></label>
 ${log!=='STL'?`<label>Priority<select id="rq_pri">${opt(['P1','P2','P3','P4'],'P3')}</select></label>`:''}
 <label>Confidentiality<select id="rq_conf">${opt(['Public','Internal','Restricted'],'Internal')}</select></label>
 ${log==='STL'?`<label>Which system?<select id="rq_sys"><option value="">Not sure / other</option>${opt(S.settings.systems.map(s=>[s.name,s.name]),'')}</select></label>`:''}
 ${log==='DRL'?`<label>Event date (if for an event)<input type="date" id="rq_ev"></label>`:''}
 ${log==='CMP'||log==='DEV'?`<label>Needed by (date)<input type="date" id="rq_need"></label>`:''}
 ${log==='CMP'?`<label>Goal (e.g. registrations targeted)<input type="number" id="rq_goal" min="0"></label>`:''}
 <label class="full">Attach files (optional, up to 5 files, 5 MB each)<input type="file" id="rq_files" multiple></label>
 </div><div id="rq_route" style="margin-top:12px">${routeHtml(log,(types[0]||{}).code)}</div>
 <div class="row" style="margin-top:14px"><button class="btn gold" id="rq_btn" onclick="submitRequest()">Submit request</button><button class="btn sec" onclick="reqLog=null;render()">Cancel</button></div></div>`;
 return h;}
async function submitRequest(){
 const log=reqLog,title=(v('rq_title')||'').trim();if(!title){alert('Please enter a short title.');return;}
 if(!(v('rq_desc')||'').trim()){alert('Please add a few details so the team understands the request.');return;}
 const dept=ME.dept||v('rq_dept');if(!dept){alert('Please choose your department.');return;}
 const it=newItem(log);Object.assign(it,{title,desc:v('rq_desc'),dept,requester:(v('rq_req')||ME.name),type:v('rq_type'),conf:v('rq_conf'),priority:log==='STL'?'P3':v('rq_pri')});
 if(log==='STL')it.system=v('rq_sys')||'';if(log==='DRL')it.eventDate=v('rq_ev')||'';if(log==='CMP'||log==='DEV')it.neededBy=v('rq_need')||'';if(log==='CMP')it.goalTarget=v('rq_goal')||'';
 const files=[...(document.getElementById('rq_files')?.files||[])].slice(0,5);
 const btn=document.getElementById('rq_btn');btn.disabled=true;btn.textContent='Submitting…';
 try{const{data,error}=await nexus.from('dd_items').insert({log,dept,data:itemPayload(it)}).select().single();if(error)throw error;
  let row=data;
  if(files.length){const up=await uploadFiles(row.id,files);if(up.length){const it2=rowToItem(row);it2.files=up;const r2=await nexus.from('dd_items').update({data:itemPayload(it2)}).eq('id',row.id).eq('version',row.version).select().single();if(!r2.error)row=r2.data;}}
  replaceItem(rowToItem(row));reqDone={id:row.id,title,log,approval:row.approval};reqLog=null;try{nexusLogEvent(CTX.profile,'dd_request_raised',{id:row.id,log});}catch(e){}render();
 }catch(e){btn.disabled=false;btn.textContent='Submit request';alert('Could not submit: '+(e.message||e));}}

/* ===================== Status helpers, My requests, department requests ===================== */
function statusOf(i){if(i.approval==='dept')return['Awaiting department head approval','p-amber'];if(i.approval==='hos')return['Awaiting Head of Sales approval','p-amber'];if(i.approval==='rejected')return['Not approved','p-red'];if(i.status==='Cancelled')return['Cancelled',''];if(isDone(i))return['Delivered','p-green'];return[stageN(i)+' · '+stageP(i)+'%','p-navy'];}
const apprPill=i=>{const s=statusOf(i);return`<span class="pill ${s[1]}">${esc(s[0])}</span>`;};
function reqTable(list,withActions){
 return`<div class="card tw"><table><tr><th>ID</th><th>Request</th><th>Type</th>${withActions?'<th>Raised by</th>':''}<th>Status</th><th>Due</th><th>Rating</th>${withActions?'<th></th>':''}</tr>${list.map(i=>{const d=i.approval==='approved'?effDue(i):null;return`<tr class="click" onclick="openReq('${i.id}')"><td><b>${i.id}</b></td><td>${esc(i.title)}<div class="small muted">${esc(LOGS[i.log].short)} · to ${esc(pname(LOGS[i.log].owner))}</div></td><td class="small">${esc(typeOf(i)?(typeOf(i).label):i.type)}</td>${withActions?`<td class="small">${esc(i.requesterName||'')}<div class="muted">${esc(i.dept||'')}</div></td>`:''}<td>${apprPill(i)}</td><td class="small">${d?fmtDT(dtStr(d)):'—'}</td><td>${+i.score>0?'★'.repeat(+i.score):(i.approval==='approved'&&isDone(i)&&i.requesterId===ME.id?'<span class="pill p-gold">rate it</span>':'')}</td>${withActions?`<td onclick="event.stopPropagation()">${i.approval==='dept'&&ME.head&&i.requesterId!==ME.id?`<button class="btn sm ok" onclick="deptDecide('${i.id}',true)">Approve</button> <button class="btn sm danger" onclick="deptDecide('${i.id}',false)">Not approve</button>`:''}</td>`:''}</tr>`;}).join('')||`<tr><td colspan="9" class="muted">Nothing here yet.</td></tr>`}</table></div>`;}
function rMyReq(){const list=S.allItems.filter(i=>i.requesterId===ME.id).sort((a,b)=>(b.id).localeCompare(a.id));
 return`<div class="row"><h2>My requests</h2><span class="sp"></span><button class="btn gold" onclick="go('req')">+ Raise a request</button></div><p class="small muted">Click a request to see its history, add files, or rate it once delivered. Your rating of delivered content feeds the Resource Building Executive's service score.</p>${reqTable(list,false)}`;}
function rDept(){const list=S.allItems.filter(i=>i.dept===ME.dept).sort((a,b)=>(b.id).localeCompare(a.id));const wait=list.filter(i=>i.approval==='dept'&&i.requesterId!==ME.id);

async function deptDecide(id,ok){const it0=S.allItems.find(x=>x.id===id);if(!it0)return;const note=prompt(ok?`Approve "${it0.title}" and send it to the Head of Sales? Optional note:`:'Reason for not approving (required):','');if(note===null)return;if(!ok&&!note.trim()){alert('A reason is required.');return;}const it=clone(it0);it.history=it.history||[];it.history.push(hist(ok?'Department head approved':'Department head did not approve',note));if(note)it.approvalNote=note;try{nexusLogEvent(CTX.profile,'dd_dept_decision',{id,ok});}catch(e){}await putItem(it,ok?'Approved — sent to Head of Sales':'Request not approved',ok?'hos':'rejected');closeModal();}
async function approveItem(id){const it0=S.allItems.find(x=>x.id===id);if(!it0)return;
 if((it0.log==='CMP'||(it0.log==='DEV'&&typeOf(it0)&&!(+typeOf(it0).days)))&&!it0.dueOverride&&!confirm('This item has no committed date yet. Approve anyway? (You can open it and set the date after approving.)'))return;
 const note=prompt(`Approve "${it0.title}" and add it to ${pname(LOGS[it0.log].owner)}'s job sheet? Optional note:`,'');if(note===null)return;
 const it=clone(it0);it.history=it.history||[];it.history.push(hist('Approved by Head of Sales',note));if(note)it.approvalNote=note;try{nexusLogEvent(CTX.profile,'dd_approved',{id});}catch(e){}await putItem(it,'Approved — now in '+pname(LOGS[it0.log].owner)+"'s work list",'approved');closeModal();}
async function rejectItem(id){const it0=S.allItems.find(x=>x.id===id);if(!it0)return;const note=prompt('Reason for not approving (the requester will see this):','');if(note===null)return;if(!note.trim()){alert('A reason is required.');return;}const it=clone(it0);it.history=it.history||[];it.history.push(hist('Not approved',note));it.approvalNote=note;try{nexusLogEvent(CTX.profile,'dd_rejected',{id});}catch(e){}await putItem(it,'Request not approved','rejected');closeModal();}
async function cancelReq(id){if(!confirm('Cancel this request?'))return;const it0=S.allItems.find(x=>x.id===id);const it=clone(it0);it.status='Cancelled';it.history=it.history||[];it.history.push(hist('Cancelled by requester',''));await putItem(it,'Request cancelled');closeModal();}
async function rateReq(id){const sc=+v('rate_sc');if(!(sc>=1&&sc<=5)){alert('Please choose a rating from 1 to 5.');return;}const it0=S.allItems.find(x=>x.id===id);const it=clone(it0);it.score=sc;it.ratingNote=(v('rate_note')||'').trim();it.history=it.history||[];it.history.push(hist('Rated '+sc+'/5',it.ratingNote));await putItem(it,'Thank you for rating');closeModal();}
function openReq(id){const i=S.allItems.find(x=>x.id===id);if(!i)return;editing=null;
 const L=LOGS[i.log],d=i.approval==='approved'?effDue(i):null,st=statusOf(i);
 const mine=i.requesterId===ME.id,pend=i.approval==='dept'||i.approval==='hos';
 let h=`<div class="row"><h2 style="margin:0">${esc(i.id)} · ${esc(L.name)}</h2><span class="sp"></span><button class="btn sec" onclick="closeModal()">Close</button></div>
 <div class="row" style="margin:6px 0 10px"><span class="pill ${st[1]}">${esc(st[0])}</span>${i.expedite&&!i.expedite.cleared?'<span class="pill p-red">expedited</span>':''}</div>
 <div class="form"><label class="full">Request<div style="color:var(--ink);font-size:14px"><b>${esc(i.title)}</b></div></label>
 <label class="full">Details<div style="color:var(--ink);white-space:pre-wrap">${esc(i.desc||'—')}</div></label>
 <label>Type<div style="color:var(--ink)">${esc(typeOf(i)?typeOf(i).label:i.type)}</div></label>
 <label>Raised by<div style="color:var(--ink)">${esc(i.requesterName||'')} · ${esc(i.dept||'')}</div></label>
 <label>Goes to<div style="color:var(--ink)">${esc(pname(L.owner))} (${esc(ROLES[L.owner])})</div></label>
 <label>Deadline<div style="color:var(--ink)">${d?fmtDT(dtStr(d)):(pend?'Set after approval':'—')}</div></label>
 ${i.eventDate?`<label>Event date<div style="color:var(--ink)">${fmtD(i.eventDate)}</div></label>`:''}${i.neededBy?`<label>Needed by<div style="color:var(--ink)">${fmtD(i.neededBy)}</div></label>`:''}</div>
 ${i.approvalNote?`<div class="banner" style="margin-top:10px"><b>Note from approver:</b> ${esc(i.approvalNote)}</div>`:''}
 <h3 style="margin-top:14px">Files</h3>${filesHtml(i)}
 ${(mine||ME.role===L.owner||isHos())?`<div class="row" style="margin-top:6px"><input type="file" id="rq_more" multiple><button class="btn sm sec" onclick="addFilesTo('${i.id}','rq_more')">Add files</button></div>`:''}`;
 if(mine&&i.approval==='approved'&&isDone(i)&&!(+i.score>0)&&i.status!=='Cancelled')h+=`<h3 style="margin-top:14px">Rate this delivery</h3><div class="row"><select id="rate_sc"><option value="">Rating…</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${n} — ${['','Poor','Fair','Good','Very good','Excellent'][n]}</option>`).join('')}</select><input id="rate_note" placeholder="Comment (optional)" style="flex:1;min-width:200px"><button class="btn gold" onclick="rateReq('${i.id}')">Submit rating</button></div>`;
 if(+i.score>0)h+=`<p style="margin-top:12px"><b>Rating:</b> ${'★'.repeat(+i.score)}${'☆'.repeat(5-(+i.score))} ${esc(i.ratingNote||'')}</p>`;
 h+=`<div class="row" style="margin-top:14px">`;
 if(i.approval==='dept'&&ME.head&&!mine)h+=`<button class="btn ok" onclick="deptDecide('${i.id}',true)">Approve & send to Head of Sales</button><button class="btn danger" onclick="deptDecide('${i.id}',false)">Not approve</button>`;
 if(mine&&pend)h+=`<button class="btn danger" onclick="cancelReq('${i.id}')">Cancel this request</button>`;
 if(i.approval==='approved'&&isOpen(i)&&canExpedite(L.owner)&&!(i.expedite&&!i.expedite.cleared))h+=`<button class="btn danger" onclick="closeModal();expediteItem('${i.id}')">Expedite</button>`;
 h+=`</div>${i.history&&i.history.length?`<h3 style="margin-top:16px">History</h3><div class="hist">${i.history.slice().reverse().map(x=>`<div><b>${fmtDT(x.at)}</b> · ${esc(x.stage)}${x.byName||x.by?' · '+esc(x.byName||ROLES[x.by]||x.by):''}${x.note?' — '+esc(x.note):''}</div>`).join('')}</div>`:''}`;
 $('#mbox').innerHTML=h;$('#modal').style.display='flex';}

/* ===================== Approvals (Head of Sales) ===================== */
function rApprovals(){
 const wait=S.allItems.filter(i=>i.approval==='hos').sort((a,b)=>a.id.localeCompare(b.id));
 const withDept=S.allItems.filter(i=>i.approval==='dept');
 const rej=S.allItems.filter(i=>i.approval==='rejected').slice(-10).reverse();
 const tbl=(list,showBtn)=>`<div class="card tw"><table><tr><th>ID</th><th>Request</th><th>Raised by</th><th>Goes to</th><th>Needed by</th><th></th></tr>${list.map(i=>`<tr><td class="click" onclick="openItem('${i.id}')"><b>${i.id}</b></td><td>${esc(i.title)}<div class="small muted">${esc(typeOf(i)?typeOf(i).label:i.type)}</div>${i.history&&i.history.some(h=>/Department head approved/.test(h.stage))?'<span class="pill p-green">dept head approved</span>':''}</td><td class="small">${esc(i.requesterName||'')}<div class="muted">${esc(i.dept||'')}</div></td><td class="small">${esc(pname(LOGS[i.log].owner))}<div class="muted">${esc(LOGS[i.log].short)}</div></td><td class="small">${fmtD(i.neededBy||i.eventDate)}</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="openItem('${i.id}')">Open</button> <button class="btn sm ok" onclick="approveItem('${i.id}')">Approve</button> <button class="btn sm danger" onclick="rejectItem('${i.id}')">Not approve</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nothing waiting.</td></tr>'}</table></div>`;
 return`<h2>Approvals</h2><p class="small muted">Nothing except a system ticket reaches the Digital Division until you approve it. Approving adds it to the owner's job sheet and starts its deadline clock.</p>
 <h3>Waiting for your approval (${wait.length})</h3>${tbl(wait)}
 <h3 style="margin-top:18px">With department heads (${withDept.length}) <span class="small muted">— you can approve these directly too</span></h3>${tbl(withDept)}
 ${rej.length?`<h3 style="margin-top:18px">Recently not approved</h3><div class="card tw"><table><tr><th>ID</th><th>Request</th><th>Reason</th></tr>${rej.map(i=>`<tr class="click" onclick="openItem('${i.id}')"><td>${i.id}</td><td>${esc(i.title)}</td><td class="small">${esc(i.approvalNote||'')}</td></tr>`).join('')}</table></div>`:''}`;}

/* ===================== Control panel additions ===================== */
async function loadProfiles(){try{const{data,error}=await nexus.from('profiles').select('id,full_name,email,role,status').order('full_name');if(error)throw error;PROFILES=data||[];}catch(e){PROFILES=[];toast('Could not load users');}render();}
const activeUsers=()=>(PROFILES||[]).filter(p=>p.status==='active');
function adminPeople(){
 if(PROFILES===null){loadProfiles();return'<div class="card">Loading Nexus users…</div>';}
 const st=S.settings,mem=uid=>MEMBERS.find(m=>m.user_id===uid)||{};
 const holder=r=>(MEMBERS.find(m=>m.dd_role===r)||{}).user_id||'';
 const users=activeUsers().filter(p=>p.role!=='admin');
 let h=`<div class="card"><h3>Organisation</h3><div class="form"><label>Organisation name${I('settings.org','text','',true)}</label></div></div>
 <div class="card"><h3>Who holds each role</h3><p class="small muted">People sign in with their own Nexus login. Pick the person for each Digital Division role (Nexus admins are automatically Head of Sales). Each person then sees only what their role allows. If someone is missing, approve their account in Admin → Users first.</p>
 <table><tr><th>Role</th><th>Person</th><th>Title</th></tr>
 <tr><td>Head of Sales</td><td colspan="2" class="muted">All Nexus admins (${esc((PROFILES||[]).filter(p=>p.role==='admin').map(p=>p.full_name||p.email).join(', ')||'—')})</td></tr>
 ${['dscm','rbe','brand'].map(r=>`<tr><td>${ROLES[r]}</td><td><select onchange="assignRole('${r}',this.value)"><option value="">— not assigned —</option>${users.map(p=>`<option value="${p.id}" ${holder(r)===p.id?'selected':''}>${esc(p.full_name||p.email)}</option>`).join('')}</select></td><td>${I('settings.people.'+r+'.title','text','',false)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Departments of staff, and department heads</h3><p class="small muted">A person's department decides who approves their requests first. Tick "Department head" for the person who approves requests from that department's staff. Requests from people with no department go straight to you.</p>
 <div class="tw"><table><tr><th>Person</th><th style="width:230px">Department</th><th style="width:130px">Department head</th></tr>${users.filter(p=>!['dscm','rbe','brand'].includes((mem(p.id)).dd_role)).map(p=>{const m=mem(p.id);return`<tr><td>${esc(p.full_name||p.email)}<div class="small muted">${esc(p.email||'')}</div></td><td><select onchange="setUserDept('${p.id}',this.value,${m.is_dept_head?'true':'false'})"><option value="">— none —</option>${opt(st.departments,m.dept||'')}</select></td><td><input type="checkbox" ${m.is_dept_head?'checked':''} ${m.dept?'':'disabled'} onchange="setUserDept('${p.id}','${esc(m.dept||'')}',this.checked)"></td></tr>`;}).join('')||'<tr><td colspan="3" class="muted">No other active users yet.</td></tr>'}</table></div></div>`;
 return h;}
async function assignRole(role,uid){try{const prev=MEMBERS.find(m=>m.dd_role===role);if(prev&&prev.user_id===uid)return;
  if(prev){const{error}=await nexus.from('dd_members').update({dd_role:'requester'}).eq('user_id',prev.user_id);if(error)throw error;}
  if(uid){const p=PROFILES.find(x=>x.id===uid);const cur=MEMBERS.find(m=>m.user_id===uid);const row={user_id:uid,full_name:p.full_name||p.email,dd_role:role,dept:(cur&&cur.dept)||'',is_dept_head:false};const{error}=await nexus.from('dd_members').upsert(row);if(error)throw error;}
  try{nexusLogEvent(CTX.profile,'dd_role_assigned',{role,uid});}catch(e){}
  await loadMembers();render();toast('Saved');}catch(e){dbErr(e);}}
async function setUserDept(uid,dept,head){try{const p=PROFILES.find(x=>x.id===uid);const cur=MEMBERS.find(m=>m.user_id===uid);const row={user_id:uid,full_name:p.full_name||p.email,dd_role:(cur&&cur.dd_role)||'requester',dept:dept||'',is_dept_head:!!(head&&dept)};const{error}=await nexus.from('dd_members').upsert(row);if(error)throw error;await loadMembers();render();toast('Saved');}catch(e){dbErr(e);}}
function adminApproval(){const st=S.settings;
 return`<div class="card"><h3>Who must approve before work reaches the Digital Division</h3><p class="small muted">Recommended setting (and what you asked for): every request except a system ticket needs your approval before it is added to anyone's job sheet. System tickets always go straight to the DSCM, because a broken system cannot wait.</p>
 <table><tr><th>Request type</th><th style="width:320px">Approval</th></tr>
 <tr><td>System tickets (STL)</td><td class="muted">Direct — no approval (fixed)</td></tr>
 ${['DEV','CMP','DRL','BRA'].map(l=>`<tr><td>${esc(LOGS[l].name)}</td><td>${SEL('settings.approval.'+l,[['hos','Head of Sales must approve'],['auto','Goes straight in (no approval)']],true)}</td></tr>`).join('')}</table>
 <p style="margin-top:12px"><label class="row" style="gap:8px">${CB('settings.deptApproval')} <span>Department head approves first, for staff in departments that have a head</span></label></p></div>`;}
function adminData(){return`<div class="card"><h3>Data</h3><p class="small">All Digital Division data is stored securely in Nexus — no backup file is needed. You can still export a copy.</p><div class="row"><button class="btn gold" onclick="exportJson()">Export everything (.json)</button><button class="btn sec" onclick="exportCsv()">Export logs (.csv)</button></div><p class="small muted">${S.allItems.length} requests & tickets · ${Object.keys(S.jobs).length} job entries · ${S.daily.length} daily reports</p></div>`;}

/* ===================== Start-up ===================== */
async function boot(){
 render();
 try{CTX=await nexusRequireAuth();if(!CTX)return;ME.id=CTX.profile.id;ME.name=CTX.profile.full_name||CTX.profile.email;
  await loadAll();READY=true;
  tab=ME.role==='hos'?'ov':ME.role==='requester'?'req':'my';
  if(ME.role==='rbe'||ME.role==='brand'){kraRole=ME.role;chkRole=ME.role;myRole=ME.role;}
  render();
  setInterval(async()=>{if(document.hidden||cfgTimer||$('#modal').style.display==='flex')return;if(!['ov','my','appr','logs','proj','myreq','dept'].includes(tab))return;try{await loadAll();render();}catch(e){}},60000);
 }catch(e){console.error(e);$('#view').innerHTML='<div class="card"><h2>Could not load</h2><p>'+esc(e.message||String(e))+'</p><p class="small muted">If this mentions a missing table, the Digital Division SQL (add-digital-division.sql) has not been run in Supabase yet.</p></div>';}
}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing)closeModal();});
boot();
</script>
