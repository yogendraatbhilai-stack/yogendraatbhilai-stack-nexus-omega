<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reset password — Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nexus.css?v=20260824h"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card auth-card">
    <div style="text-align:center;margin-bottom:22px;">
      <div class="display" style="font-size:22px;">Reset your password</div>
      <p class="muted" style="font-size:13px;">We'll email you a secure link.</p>
    </div>
    <label>Email</label>
    <input id="rpEmail" type="email" placeholder="you@omegafinancial.co.in" style="margin-bottom:18px;"/>
    <button class="btn btn-primary" style="width:100%;" onclick="sendReset()">Send reset link</button>
    <p style="text-align:center;margin-top:18px;"><a href="login.html" style="font-size:13px;">Back to sign in</a></p>
  </div>
</div>
<script src="supabase-client.js?v=20260824h"></script>
<script src="auth-guard.js?v=20260824h"></script>
<script>
async function sendReset(){
  const email = document.getElementById('rpEmail').value.trim();
  if (!email) return nexusToast('Enter your email.', 'err');
  const redirectTo = window.location.origin + window.location.pathname.replace('reset-password.html','update-password.html');
  const { error } = await nexus.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) return nexusToast(error.message, 'err');
  nexusToast('Check your inbox for the reset link.', 'ok');
}
</script>
</body>
</html>
