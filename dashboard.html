<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard — Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nexus.css?v=20260824h"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{ background: linear-gradient(180deg, #fbf9f2 0%, var(--paper) 260px); }
  .dash-hero{
    background: linear-gradient(120deg, var(--navy) 0%, #123a5e 100%);
    color:#fff; border-radius: 20px; padding: 40px 36px; margin-top: 34px;
    position:relative; overflow:hidden;
  }
  .dash-hero::after{
    content:""; position:absolute; right:-70px; top:-70px; width:260px; height:260px;
    background: radial-gradient(circle, rgba(212,175,55,.26), transparent 70%);
  }
  .dash-hero .eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--gold-soft); font-weight:700; margin-bottom:10px; }
  .dash-hero h1{ color:#fff; margin:0 0 6px; font-size: 32px; }
  .dash-hero p{ color:#cfd9e3; margin:0; font-size:14.5px; max-width:520px; }

  .sec-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; margin-top:34px; }
  .sec-card{
    position:relative; overflow:hidden; border-top: 4px solid var(--gold);
    padding-top:24px;
  }
  .sec-card .icon-tag{
    width:50px;height:50px;border-radius:13px;
    background: linear-gradient(135deg, rgba(14,42,71,.08), rgba(212,175,55,.16));
    display:flex;align-items:center;justify-content:center;color:var(--navy);margin-bottom:18px;
  }
  .sec-card h3{ margin:0 0 6px; font-size:20px; }
  .sec-card p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 18px; min-height:38px; line-height:1.5; }
  .sec-card .toolcount{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .sec-card .arrow{ position:absolute; right:22px; top:26px; color:var(--gold); opacity:0; transition:opacity .15s ease, transform .15s ease; }
  .sec-card:hover{ transform: translateY(-3px); box-shadow: 0 14px 32px rgba(14,42,71,.12); }
  .sec-card:hover .arrow{ opacity:1; transform: translateX(3px); }
  .sec-card{ transition: transform .15s ease, box-shadow .15s ease; }
  .sec-card.locked{ opacity:.5; border-top-color: var(--danger); }
  .sec-card.locked:hover{ transform:none; box-shadow:none; }
  .sec-card.locked::before{ content:"Restricted"; position:absolute; top:24px; right:22px; font-size:11px; font-weight:700; color:var(--danger); text-transform:uppercase; letter-spacing:.04em;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span> Nexus</div>
  <div>
    <span class="user-chip" id="whoami"></span>
    <a href="profile.html">My Profile</a>
    <a href="policies.html">Policies &amp; Help</a>
    <a href="admin.html" id="adminLink" style="display:none;">Admin panel</a>
    <a href="#" onclick="nexusSignOut()">Sign out</a>
  </div>
</div>

<div class="container" style="padding-bottom:60px;">
  <div class="dash-hero">
    <div class="eyebrow">Nexus · by Omega Financial</div>
    <h1 id="greeting">Welcome</h1>
    <p id="subGreeting">Pick a section to open its tools.</p>
  </div>

  <div class="sec-grid" id="secGrid"></div>

  <div class="conviction-line"></div>
  <p class="muted" style="font-size:13px;">Reports you save inside any tool are permanent once created — only a Nexus admin can amend or remove one.</p>
</div>

<script src="supabase-client.js?v=20260824h"></script>
<script src="auth-guard.js?v=20260824h"></script>
<script>
const SECTION_ICONS = {
  sales: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/></svg>`,
  customer_awareness: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 18-5v12L3 14v-3Z"/><path d="M11.6 16.8a3 3 0 0 1-5.8-1.6"/></svg>`,
  iap: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`
};
const DEFAULT_ICON = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;

function sectionLink(key){ return `section.html?s=${encodeURIComponent(key)}`; }

(async () => {
  const ctx = await nexusRequireAuth();
  if (!ctx) return;
  await nexusEnsureDeclaration(ctx.profile);
  const { profile } = ctx;

  document.getElementById('whoami').textContent = profile.full_name || profile.email;
  document.getElementById('greeting').textContent = `Welcome, ${(profile.full_name || profile.email).split(' ')[0]}`;
  if (profile.role === 'admin'){
    document.getElementById('adminLink').style.display = '';
    document.getElementById('subGreeting').textContent = 'You have admin access to every section and the reporting dashboard.';
  }

  const cat = await nexusGetCatalogue(profile);
  const grid = document.getElementById('secGrid');
  grid.innerHTML = '';

  cat.sections.forEach(sec => {
    const allowed = nexusCanSeeSection(cat, sec.id);
    const toolCount = cat.tools.filter(t => t.section_id === sec.id && (allowed ? nexusCanSeeTool(cat, t.id) : true)).length;
    const href = sectionLink(sec.key);
    const div = document.createElement(allowed ? 'a' : 'div');
    div.className = 'card sec-card' + (allowed ? '' : ' locked');
    if (allowed) { div.href = href; div.style.textDecoration = 'none'; div.style.color = 'inherit'; div.style.display = 'block'; }
    div.innerHTML = `
      <div class="icon-tag">${SECTION_ICONS[sec.key] || DEFAULT_ICON}</div>
      <h3>${sec.name}</h3>
      <p>${sec.description || ''}</p>
      <div class="toolcount">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        ${toolCount} tool${toolCount === 1 ? '' : 's'} inside
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    `;
    grid.appendChild(div);
  });
})();
</script>
</body>
</html>
